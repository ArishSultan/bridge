# Build libghostty from the pinned vendor/ghostty submodule, or restore it from the cache: it only
# changes when the submodule, its patches or the build script do.
name: libghostty
description: Build or restore vendor/GhosttyKit.xcframework and vendor/share

inputs:
  cache:
    description: Restore a cached build when one matches (off for releases, which always build)
    default: "true"

runs:
  using: composite
  steps:
    - name: Cache key
      id: key
      shell: bash
      run: |
        commit=$(git rev-parse HEAD:vendor/ghostty)
        inputs=$(cat patches/ghostty/*.patch scripts/build-ghostty.sh | shasum -a 256 | cut -c1-16)
        echo "key=ghostty-$commit-$inputs" >> "$GITHUB_OUTPUT"

    - name: Restore
      id: cache
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          vendor/GhosttyKit.xcframework
          vendor/share
        key: ${{ steps.key.outputs.key }}

    - name: Install Zig
      if: steps.cache.outputs.cache-hit != 'true'
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: 0.15.2
        # Zig's own cache from another runner image can point at an SDK this one doesn't have,
        # and then Zig's build program fails to link. The built library is cached above instead.
        use-cache: false

    - name: Build
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Ghostty's shaders need the Metal compiler, a separate download on newer Xcode.
        xcrun -sdk macosx metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
        # Zig 0.15 can't link against every macOS SDK: with some, its build program fails with
        # every libSystem symbol undefined. Try the default Xcode, then older installed ones
        # (only for libghostty; the app builds with the default Xcode).
        for developer in "" /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.0.1.app; do
          if [ -n "$developer" ]; then
            [ -d "$developer" ] || continue
            export DEVELOPER_DIR="$developer/Contents/Developer"
            xcrun -sdk macosx metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
            rm -rf vendor/ghostty/.zig-cache
          fi
          echo "::group::libghostty with $(xcrun --sdk macosx --show-sdk-path)"
          if ./scripts/build-ghostty.sh; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
        done
        echo "::error::libghostty didn't build with any installed Xcode"
        exit 1

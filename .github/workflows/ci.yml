# Build and test every push to main and every pull request.
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # GitHub's free Apple Silicon runner.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/libghostty

      - name: Build
        run: swift build --force-resolved-versions

      - name: Test
        run: swift test

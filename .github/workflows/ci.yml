# Build and test every push to main and every pull request.
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # GitHub's free Apple Silicon runner.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/libghostty

      - name: Build
        run: swift build --force-resolved-versions

      - name: Test
        run: swift test
